name: screenshots

# Run by hand (Actions → screenshots → Run workflow). Builds a Debug app for the watchOS simulator,
# shoots it on three watch sizes with scripts/screenshots.sh, uploads the PNGs as an artifact and
# force-pushes them to the `screenshots` branch (raw frames; the curated ones live in docs/img/).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: watchOS simulator runtime
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes

      - name: Build for the watchOS simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tactus.xcodeproj \
            -scheme Tactus \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            | tail -20

      - name: Take screenshots
        env:
          SHOTS_ONLY: medium
        run: bash scripts/screenshots.sh build/Build/Products/Debug-watchsimulator/Tactus.app shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw screenshots from run ${{ github.run_id }} at ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" screenshots
